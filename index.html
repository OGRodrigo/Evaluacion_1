<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta
        name="description"
        content="Nexus Store, catálogo de productos tecnológicos."
    >
    <title>
        Nexus Store | Inicio
    </title>

    <!-- ======================================
         GOOGLE FONTS
    ======================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- ======================================
         BOOTSTRAP CSS
    ======================================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- ======================================
         CSS
    ======================================= -->

    <link
        rel="stylesheet"
        href="css/custom.css"
    >

</head>

<body>


    <!-- ======================================
         HEADER
    ======================================= -->

    <header class="site-header">


        <!-- ==================================
             NAVEGACIÓN PRINCIPAL
        =================================== -->

        <nav
            class="navbar navbar-expand-lg nexus-navbar"
            aria-label="Navegación principal"
        >
            <div class="container">


                <!-- ==========================
                     MARCA
                =========================== -->

                <a
                    class="navbar-brand nexus-brand"
                    href="index.html"
                    aria-label="Nexus Store, volver al inicio"
                >
                    <span class="brand-main">
                        NEXUS
                    </span>
                    <span class="brand-accent">
                        STORE
                    </span>
                </a>

                <!-- ==========================
                     BOTÓN MOBILE
                =========================== -->

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar"
                    aria-expanded="false"
                    aria-label="Abrir menú de navegación"
                >
                    <span
                        class="navbar-toggler-icon"
                    ></span>
                </button>

                <!-- ==========================
                     MENÚ DE NAVEGACIÓN
                =========================== -->

                <div
                    class="collapse navbar-collapse"
                    id="mainNavbar"
                >
                    <ul
                        class="navbar-nav ms-auto align-items-lg-center"
                    >
                        <!-- INICIO -->

                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                aria-current="page"
                                href="index.html"
                            >
                                Inicio
                            </a>

                        </li>

                        <!-- PRODUCTOS -->

                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="productos.html"
                            >
                                Productos
                            </a>

                        </li>

                        <!-- CONTACTO -->

                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="contacto.html"
                            >
                                Contacto
                            </a>
                        </li>

                        <!-- CARRITO -->

                        <li class="nav-item ms-lg-3">
                            <a
                                class="btn btn-nexus-cart"
                                href="#"
                                aria-label="Ver carrito de compras"
                            >
                                Carrito
                                <span
                                    id="cart-count"
                                    class="cart-count"
                                    aria-label="0 productos en el carrito"
                                >
                                    0
                                </span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <!-- ======================================
     CONTENIDO PRINCIPAL
======================================= -->

<main>

    <!-- ==================================
         HERO
    =================================== -->

    <section class="hero">
        <div class="container">
            <div class="row align-items-center">

                <!-- ======================
                     CONTENIDO DEL HERO
                ======================= -->

                <div class="col-12 col-lg-6">
                    <div class="hero-content">
                        <p class="hero-eyebrow">
                            Tecnología para todos
                        </p>
                        <h1 class="hero-title">
                            Potencia tu mundo
                            <span class="hero-title-accent">
                                con tecnología.
                            </span>
                        </h1>

                        <p class="hero-description">

                            Descubre notebooks, smartphones,
                            audio y gaming seleccionados para
                            trabajar, jugar y conectarte.
                        </p>

                        <!-- Acciones -->

                        <div class="hero-actions">
                            <a
                                href="productos.html"
                                class="btn btn-nexus-primary"
                            >
                                Ver productos
                            </a>
                            <a
                                href="contacto.html"
                                class="btn btn-nexus-outline"
                            >
                                Contáctanos
                            </a>
                        </div>
                    </div>
                </div>

                <!-- ======================
                     IMAGEN DEL HERO
                ======================= -->

                <div class="col-12 col-lg-6">
                    <div class="hero-media">
                        <img
                            src="img/Image_Hero.jpg"
                            alt="Notebook, smartphone y audífonos representando productos tecnológicos de Nexus Store"
                            class="img-fluid hero-image"
                        >
                    </div>
                </div>
            </div>
        </div>
    </section>



    

</main>

    <!-- ======================================
         BOOTSTRAP JAVASCRIPT
    ======================================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

    <!-- ======================================
         JAVASCRIPT 
    ======================================= -->

    <script src="js/main.js"></script>


</body>

</html>
